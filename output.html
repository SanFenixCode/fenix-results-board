<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fenix Graphics Output</title>
<link rel="stylesheet" href="fonts.css">
<script src="races.js"></script>
<style>
  :root {
    --ink: rgb(14, 18, 34);
    --blue-tag: rgb(12, 40, 120);
    --red-tag: rgb(150, 14, 26);
    --blue-hi: rgb(34, 92, 214);
    --red-hi: rgb(214, 34, 44);
  }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #stage {
    position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px;
    transform-origin: 0 0; overflow: hidden; background: #050814;
    font-family: 'Inter Black', sans-serif; color: var(--ink);
  }
  #stage > * { position: absolute; }
  /* Ballot measures: YES (green) on the left, NO (orange) on the right */
  #stage.measure { --blue-tag: rgb(10, 112, 62); --red-tag: rgb(186, 82, 8); --blue-hi: rgb(26, 160, 92); --red-hi: rgb(226, 112, 22); }
  #summary { top: 222px; height: 60px; line-height: 60px; padding: 0 35px; background: rgba(255,255,255,.96); font-size: 40px; white-space: nowrap; transform: translateX(-50%); display: none; }
  .measure #summary { display: block; }
  .measure #result-tag { display: none; }
  .layer { left: 0; top: 0; width: 1920px; height: 1080px; }
  img.layer { display: block; }

  /* Standby slate (shown when nothing is on output) */
  #standby {
    background: radial-gradient(ellipse at 25% 40%, rgba(34,92,214,.35), transparent 60%),
                radial-gradient(ellipse at 75% 40%, rgba(214,34,44,.30), transparent 60%), #070b1c;
    display: flex; align-items: center; justify-content: center; flex-direction: column;
    color: rgba(255,255,255,.85); letter-spacing: .08em; transition: opacity .3s;
  }
  #standby .big { font-size: 64px; }
  #standby .small { font-family: 'Inter SemiBold'; font-size: 26px; opacity: .6; margin-top: 18px; }
  #stage.has-race #standby { opacity: 0; }

  /* Loser treatment: desaturated, darker copy of the photo clipped to the losing side */
  #dim { filter: grayscale(1) brightness(.42) contrast(.95); opacity: 0; transition: opacity .7s ease; }
  #dim.dem { clip-path: polygon(0 0, 989px 0, 901px 1080px, 0 1080px); }
  #dim.gop { clip-path: polygon(1019px 0, 1920px 0, 1920px 1080px, 931px 1080px); }
  .called #dim { opacity: 1; }

  /* One-time light sweep across the winner's side */
  #sweep { opacity: 0; }
  #sweep.dem { clip-path: polygon(0 0, 989px 0, 901px 1080px, 0 1080px); }
  #sweep.gop { clip-path: polygon(1019px 0, 1920px 0, 1920px 1080px, 931px 1080px); }
  #sweep::before {
    content: ""; position: absolute; top: -200px; bottom: -200px; width: 260px; left: -400px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.22), transparent);
    transform: skewX(-12deg);
  }
  .called.anim #sweep { opacity: 1; }
  .called.anim #sweep.dem::before { animation: sweepR 1.1s .35s ease-in-out both; }
  .called.anim #sweep.gop::before { animation: sweepL 1.1s .35s ease-in-out both; }
  @keyframes sweepR { from { left: -400px; } to { left: 1100px; } }
  @keyframes sweepL { from { left: 1920px; } to { left: 820px; } }

  /* Header: office label over state name, centered on the bar */
  #header { top: 70px; text-align: center; }
  #header .label { height: 34px; line-height: 34px; background: #fff; font-size: 24px; }
  #header .state { height: 96px; line-height: 96px; background: rgba(14,18,34,.94); color: #fff; font-size: 76px; white-space: nowrap; }
  #header .rule { height: 6px; background: linear-gradient(90deg, var(--blue-tag) 50%, var(--red-tag) 50%); }

  /* HOLD / FLIP tag under the header */
  #result-tag {
    top: 218px; height: 50px; line-height: 50px; padding: 0 26px; color: #fff; font-size: 30px;
    letter-spacing: .06em; transform: translateX(-50%) scaleY(0); transform-origin: top;
    white-space: nowrap; box-shadow: 0 6px 18px rgba(0,0,0,.35);
  }
  #result-tag.dem { background: var(--blue-tag); }
  #result-tag.gop { background: var(--red-tag); }
  .called #result-tag { transform: translateX(-50%) scaleY(1); transition: transform .35s .9s cubic-bezier(.2,1.4,.4,1); }

  /* Name plates (same geometry as render.py) */
  .plate { top: 838px; width: 760px; transition: opacity .6s, filter .6s; }
  .plate.dem { left: 70px; }
  .plate.gop { left: 1090px; }
  .plate .tag { height: 42px; line-height: 42px; padding: 0 22px; color: #fff; font-size: 26px; display: inline-block; }
  .plate.dem .tag { background: var(--blue-tag); }
  .plate.gop .tag { background: var(--red-tag); }
  .plate.gop .tags { text-align: right; }
  .plate .name { height: 92px; line-height: 92px; background: #fff; padding: 0 30px; font-size: 66px; white-space: nowrap; }
  .plate .title { height: 50px; line-height: 50px; background: var(--ink); padding: 0 30px; font-family: 'Inter SemiBold'; font-size: 28px; color: rgb(225,230,240); white-space: nowrap; }
  .plate .edge { height: 6px; }
  .plate.dem .edge { background: var(--blue-tag); }
  .plate.gop .edge { background: var(--red-tag); }
  .plate.gop .name, .plate.gop .title { text-align: right; }
  .called .plate.loser { filter: grayscale(1) brightness(.62); }

  /* PROJECTED WINNER banner, above the winner's plate */
  #win {
    top: 738px; width: 760px; height: 94px; display: flex; align-items: center; gap: 22px;
    padding: 0 26px; box-sizing: border-box; color: #fff; font-size: 52px; letter-spacing: .02em;
    clip-path: inset(100% 0 0 0); box-shadow: 0 8px 24px rgba(0,0,0,.35);
  }
  #win.dem { left: 70px; background: linear-gradient(90deg, var(--blue-hi), var(--blue-tag)); }
  #win.gop { left: 1090px; background: linear-gradient(270deg, var(--red-hi), var(--red-tag)); flex-direction: row-reverse; }
  #win .check { width: 66px; height: 66px; border-radius: 50%; background: #fff; flex: none; display: grid; place-items: center; transform: scale(0); }
  #win .check svg { width: 44px; height: 44px; }
  #win.dem .check svg { stroke: var(--blue-tag); }
  #win.gop .check svg { stroke: var(--red-tag); }
  .called #win { clip-path: inset(0 0 0 0); transition: clip-path .45s .25s cubic-bezier(.2,.8,.2,1); }
  .called #win .check { transform: scale(1); transition: transform .4s .65s cubic-bezier(.2,1.6,.4,1); }
  /* Without animation (e.g. re-showing an already-called race), everything snaps into place */
  #stage:not(.anim) * { transition: none !important; }
</style>
</head>
<body>
<div id="stage">
  <img id="photo" class="layer" alt="">
  <img id="dim" class="layer" alt="">
  <div id="sweep" class="layer"></div>
  <div id="header"><div class="label"></div><div class="state"></div><div class="rule"></div></div>
  <div id="result-tag"></div>
  <div id="summary"></div>
  <div class="plate dem"><div class="tags"><span class="tag">DEMOCRAT</span></div><div class="name"></div><div class="title"></div><div class="edge"></div></div>
  <div class="plate gop"><div class="tags"><span class="tag">REPUBLICAN</span></div><div class="name"></div><div class="title"></div><div class="edge"></div></div>
  <div id="win"><div class="check"><svg viewBox="0 0 24 24" fill="none" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12.5l5 5 10-11"/></svg></div><span id="win-text">PROJECTED WINNER</span></div>
  <div id="standby" class="layer"><div class="big">MIDTERMS MADNESS 2026</div><div class="small">GRAPHICS STANDBY</div></div>
</div>
<script>
const stage = document.getElementById('stage');
const $ = s => stage.querySelector(s);
const BAR_TOP = 1004, BAR_BOTTOM = 916, H = 1080;
const barX = y => BAR_TOP + (BAR_BOTTOM - BAR_TOP) * y / H;

function fitStage() {
  const s = Math.min(innerWidth / 1920, innerHeight / 1080);
  stage.style.transform = `scale(${s}) translate(-50%, -50%)`;
}
addEventListener('resize', fitStage);
fitStage();

// Shrink an element's font until its text fits in maxW (mirrors render.py's fit()).
function fit(el, size, maxW) {
  el.style.fontSize = size + 'px';
  const probe = document.createElement('span');
  probe.style.cssText = 'position:absolute;visibility:hidden;white-space:nowrap';
  probe.style.fontFamily = getComputedStyle(el).fontFamily;
  probe.textContent = el.textContent;
  document.body.appendChild(probe);
  while (size > 20) {
    probe.style.fontSize = size + 'px';
    if (probe.getBoundingClientRect().width <= maxW) break;
    size -= 2;
  }
  probe.remove();
  el.style.fontSize = size + 'px';
  return size;
}

let current = { slug: null, winner: null };

// Preload every race photo so switching races never shows a half-loaded frame.
const photos = {};
for (const r of window.RACES || []) {
  const img = new Image();
  img.src = 'images/' + r.slug + '.png';
  photos[r.slug] = img.decode().catch(() => {});
}

let seq = 0;
async function show(slug, winner, animate) {
  const race = (window.RACES || []).find(r => r.slug === slug);
  const mine = ++seq;
  if (!race) {
    stage.classList.remove('called', 'anim', 'has-race');
    current = { slug: null, winner: null };
    return;
  }
  await photos[race.slug];
  if (mine !== seq) return;  // a newer command arrived while the photo loaded

  // Snap back to the un-called look with transitions off, so nothing from the
  // previous graphic (or the standby slate) fades through on the way.
  stage.classList.remove('called', 'anim');
  const src = 'images/' + race.slug + '.png';
  if ($('#photo').getAttribute('src') !== src) { $('#photo').src = src; $('#dim').src = src; }

  // Header, sized and centered like render.py
  const hd = $('#header');
  hd.querySelector('.label').textContent = race.office;
  const st = hd.querySelector('.state');
  st.textContent = race.state;
  fit(st, 76, 820);
  const probe = document.createElement('span');
  probe.style.cssText = `position:absolute;visibility:hidden;white-space:nowrap;font-family:'Inter Black';font-size:${st.style.fontSize}`;
  probe.textContent = race.state;
  document.body.appendChild(probe);
  const w = Math.max(Math.round(probe.getBoundingClientRect().width) + 110, 420);
  probe.remove();
  const cx = barX(95);
  hd.style.left = (cx - w / 2) + 'px';
  hd.style.width = w + 'px';

  const measure = race.kind === 'measure';
  stage.classList.toggle('measure', measure);
  const sm = $('#summary');
  sm.textContent = (race.summary || '').toUpperCase();
  if (measure) { fit(sm, 40, 1300); sm.style.left = barX(250) + 'px'; }
  $('#win-text').textContent = !measure ? 'PROJECTED WINNER' : winner === 'gop' ? 'PROJECTED TO FAIL' : 'PROJECTED TO PASS';

  for (const side of ['dem', 'gop']) {
    const p = $('.plate.' + side);
    p.querySelector('.tag').textContent = measure ? (side === 'dem' ? 'A YES VOTE MEANS' : 'A NO VOTE MEANS') : (side === 'dem' ? 'DEMOCRAT' : 'REPUBLICAN');
    p.querySelector('.name').textContent = (race[side].means || race[side].name).toUpperCase();
    fit(p.querySelector('.name'), 66, 700);
    const t = p.querySelector('.title');
    t.textContent = (race[side].title || '').toUpperCase();
    t.style.display = race[side].title ? '' : 'none';
    fit(t, 28, 700);
    p.classList.toggle('loser', !!winner && winner !== side);
  }

  if (winner) {
    const loser = winner === 'dem' ? 'gop' : 'dem';
    $('#dim').className = 'layer ' + loser;
    $('#sweep').className = 'layer ' + winner;
    $('#win').className = winner;
    const tag = $('#result-tag');
    tag.className = winner;
    tag.style.left = barX(243) + 'px';
    const party = winner === 'dem' ? 'DEM' : 'GOP';
    tag.textContent = race.held ? `${party} ${race.held === winner ? 'HOLD' : 'FLIP'}` : `${party} WIN`;
  }

  stage.classList.add('has-race');
  void stage.offsetWidth;  // commit the un-called state before turning transitions back on
  if (animate) stage.classList.add('anim');
  void stage.offsetWidth;
  if (winner) {
    if (animate) setTimeout(() => stage.classList.add('called'), 120);
    else stage.classList.add('called');
  }
  current = { slug, winner };
}

addEventListener('message', e => {
  const m = e.data || {};
  if (m.type === 'show') show(m.slug, m.winner, m.animate);
  if (m.type === 'clear') show(null);
});

// Ask the board for the current state after a reload.
for (const w of [window.opener, window.parent]) {
  if (w && w !== window) try { w.postMessage({ type: 'output-ready' }, '*'); } catch (_) {}
}

// Open output.html#georgia/dem to check a look without the board.
function fromHash() {
  if (location.hash.length < 2) return;
  const [slug, winner, anim] = location.hash.slice(1).split('/');
  document.fonts.ready.then(() => show(slug, winner || null, anim === 'anim'));
}
addEventListener('hashchange', fromHash);
fromHash();
</script>
</body>
</html>
